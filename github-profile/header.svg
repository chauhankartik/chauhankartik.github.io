<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Gradient for Title -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Glowing Circle Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .pill { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #38bdf8; text-transform: uppercase; }
    .name { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; fill: url(#textGrad); }
    .title { font-size: 15px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.2px; }
    .summary { font-size: 12.5px; fill: #64748b; }
    .chip-text { font-size: 11px; font-weight: 600; fill: #cbd5e1; }
  </style>

  <!-- Card Background -->
  <rect width="850" height="220" rx="12" fill="url(#bgGrad)" />
  <rect width="850" height="220" rx="12" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="780" cy="40" r="90" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="50" cy="180" r="80" fill="#818cf8" fill-opacity="0.07" filter="url(#glow)" />

  <!-- Card Border -->
  <rect x="0.5" y="0.5" width="849" height="219" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Top Status Pill -->
  <g transform="translate(40, 32)">
    <rect width="250" height="22" rx="11" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="15" class="mono pill">STAFF SYSTEMS ARCHITECT</text>
  </g>

  <!-- Name & Title -->
  <text x="40" y="94" class="sans name">Kartik Chauhan</text>
  <text x="40" y="122" class="sans title">Distributed Systems · Database Storage Engines · High-Throughput Pipelines</text>

  <!-- Tagline / Elevator Line -->
  <text x="40" y="152" class="mono summary">$ mechanical_sympathy --from="Linux kernel epoll &amp; zero-copy" --to="Raft consensus &amp; LSM-trees"</text>

  <!-- Interactive / Competency Chips -->
  <g transform="translate(40, 175)">
    <!-- Chip 1: Java 21 Loom -->
    <rect x="0" y="0" width="128" height="24" rx="4" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="64" y="16" text-anchor="middle" class="mono chip-text">☕ Java 21 / Loom</text>

    <!-- Chip 2: Rust / LSM -->
    <rect x="136" y="0" width="122" height="24" rx="4" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="197" y="16" text-anchor="middle" class="mono chip-text">🦀 Rust / MiniDB</text>

    <!-- Chip 3: Kafka Streaming -->
    <rect x="266" y="0" width="138" height="24" rx="4" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="335" y="16" text-anchor="middle" class="mono chip-text">🌊 Kafka 500k eps</text>

    <!-- Chip 4: Raft & Distributed -->
    <rect x="412" y="0" width="134" height="24" rx="4" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="479" y="16" text-anchor="middle" class="mono chip-text">⚖️ Raft Consensus</text>

    <!-- Chip 5: Linux Kernel -->
    <rect x="554" y="0" width="132" height="24" rx="4" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="620" y="16" text-anchor="middle" class="mono chip-text">🐧 Linux epoll / IO</text>
  </g>

  <!-- Right Decorative Terminal Icon / Brand Mark -->
  <g transform="translate(730, 75)" opacity="0.85">
    <rect width="64" height="64" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="32" y="40" text-anchor="middle" class="mono" font-size="24" font-weight="800" fill="#38bdf8">KC</text>
  </g>
</svg>
